  <title>오시는 길</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 32px 18px; background: #f5f6f8;
      color: #17191d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    main {
      width: min(100%, 560px); padding: 42px 30px; background: #fff;
      border: 1px solid #e8e9ec; border-radius: 22px;
      box-shadow: 0 12px 36px rgba(20, 25, 35, .06);
    }
    h1 { margin: 0 0 28px; text-align: center; font-size: 28px; font-weight: 800; letter-spacing: -1.2px; }
    .buttons { display: grid; gap: 13px; }
    a {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 66px; padding: 0 22px; border: 1px solid #e2e4e8;
      border-radius: 13px; color: #17191d; background: #fff; text-decoration: none;
      font-size: 17px; font-weight: 750; letter-spacing: -.4px;
      transition: background .18s, border-color .18s, transform .18s;
    }
    a:hover { background: #f7f8fa; border-color: #aeb4bf; transform: translateY(-1px); }
    .arrow { color: #858b96; font-size: 22px; font-weight: 400; }
    @media (max-width: 420px) {
      main { padding: 34px 20px; }
      h1 { font-size: 25px; }
      a { min-height: 62px; padding: 0 17px; font-size: 15px; }
    }
  </style>
